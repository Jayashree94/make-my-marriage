version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: make-my-marriage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-makemymarriage}
      POSTGRES_USER: ${DB_USERNAME:-makemymarriage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-makemymarriage} -d ${DB_NAME:-makemymarriage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
